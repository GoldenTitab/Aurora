org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
# kotlin.jvm.target.validation.mode is left at the Kotlin default (error).
